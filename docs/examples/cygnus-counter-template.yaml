# Counter demo ActorTemplate for Cygnus: the pre-built counter image from
# Harbor (the demo's ko:// reference pinned by ate-setup publish), no
# workerSelector so it lands on the installed default-workers pool, and no
# storageLocation so snapshots use the cluster-wide s3:// location.
# Apply with: kubectl ate create actor-template -f docs/examples/cygnus-counter-template.yaml

metadata:
  atespace: ate-demo-counter
  name: counter
containers:
- name: counter
  image: harbor.unsigned.gg/platform/counter@sha256:196325ad0202a851efcbe3be67e93640f2b83ca9b048c2d7808aa42fbb749b18
  command:
  - /ko-app/counter
  - --extra-port=9090
  - --tcp-port=9091
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
  volumeMounts:
  - name: data
    mountPath: /home/counter
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912 # 512Mi
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
volumes:
- name: data
  durableDir: {}
