# The Cygnus default pool: four gVisor workers on the class default
# SandboxConfig (gvisor-default, as ate-setup installs it). The worker image is
# the v0.6.0 build published to Harbor by `ate-setup publish worker-images`,
# pinned by digest. Applied after `ate-setup deploy ate-system`; see
# docs/cygnus-install.md.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: default-workers
  namespace: ate-system
spec:
  replicas: 4
  workerImage: harbor.unsigned.gg/platform/ateworker-gvisor@sha256:3e97cd95e44462a38f00ef06d5943ae681d9193f920b0e6bcb19e73c80d2c140
  sandboxClasses:
  - name: gvisor
  template:
    # Limits size the worker pod and advertise its per-actor ceiling; requests
    # keep the pool placeable next to the rest of the install. Memory is not
    # compressible, so its request matches the limit.
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 2Gi
