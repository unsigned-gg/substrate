# Cygnus enforces Pod Security Standards per namespace, baseline by default.
# atelet mounts hostPaths and the workers run gVisor, which baseline refuses,
# so ate-system is privileged like the cluster's other node-level namespaces
# (longhorn-system, kube-system). Applied before `ate-setup deploy ate-system`,
# which re-applies upstream's unlabelled namespace manifest without removing
# labels it did not set.
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
