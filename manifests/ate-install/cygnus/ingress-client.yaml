# The one client identity the Envoy ingress router accepts on Cygnus
# (ingressAllowedSPIFFEIDs in docs/examples/cygnus-install.yaml). The
# podidentity signer issues spiffe://cluster.local/ns/ate-system/sa/ate-ingress-client
# to any pod that runs as this ServiceAccount and mounts a podCertificate
# projected volume for podidentity.podcert.ate.dev/identity. Any listed client
# may reach any actor, so grant this account only to the workloads that should.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-ingress-client
  namespace: ate-system
automountServiceAccountToken: false
