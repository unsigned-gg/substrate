# The Cygnus install document (docs/cygnus-install.md). Pass it with --config.
# Only what differs from the defaults is named; see operator-install.md.
apiVersion: install.ate.dev/v1alpha1
kind: SubstrateInstall

namespace: ate-system
context: cygnus
clusterSize: size0
rolloutTimeout: 10m0s

atenet:
  # atenet-router and atenet-egress run agentgateway, from the Harbor mirror
  # pinned in manifests/ate-install/components/cygnus.
  dataplane: agentgateway

images:
  # Pre-built by `ate-setup publish release-images` from the same checkout.
  # ate-setup pins each reference to the digest the tag names at install time.
  repo: harbor.unsigned.gg/platform
  tag: v0.6.0

storage:
  # The in-cluster rustfs (manifests/ate-install/cygnus/rustfs), reached over
  # the S3 API by the objectstore-plugin sidecars. The credentials are in the
  # ate-objectstore-s3 Secret, never in this file.
  bucketName: ate-snapshots
  snapshotLocation: s3://ate-snapshots/

# Grafana Alloy is the cluster's OTLP collector.
otlpEndpoint: http://alloy-gateway.monitoring.svc.cluster.local:4317

manifests:
  # Composed into every control plane apply: Harbor pull Secret, S3 storage
  # settings, Alloy telemetry, no GKE credential provider or Managed Prometheus.
  components: manifests/ate-install/components/cygnus
